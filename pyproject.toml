[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tour-assistant"
version = "1.1.0"
description = "Route-aware live tour assistant for Hermes Agent"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
