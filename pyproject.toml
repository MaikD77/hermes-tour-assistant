[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tour-assistant"
version = "1.3.0"
description = "Route-aware live tour assistant for Hermes Agent"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "build>=1.2,<2",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.data-files]
"share/hermes-tour-assistant/skills/outdoor-tour-assistant" = [
  "skills/outdoor-tour-assistant/SKILL.md",
]
"share/hermes-tour-assistant/skills/outdoor-tour-assistant/scripts" = [
  "skills/outdoor-tour-assistant/scripts/*.py",
]
"share/hermes-tour-assistant/skills/outdoor-tour-assistant/references" = [
  "skills/outdoor-tour-assistant/references/*.md",
]
"share/hermes-tour-assistant/skills/live-location-nearby" = [
  "skills/live-location-nearby/SKILL.md",
]
"share/hermes-tour-assistant/skills/live-location-nearby/scripts" = [
  "skills/live-location-nearby/scripts/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.coverage.run]
branch = true
source = ["skills/outdoor-tour-assistant/scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
